<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>דיווח רכבים במוסך</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f2f3f9;
    --surface:#ffffff;
    --surface-2:#e9eaf3;
    --outline:#cbccd7;
    --ink:#1a1b21;
    --ink-dim:#5c5e6a;
    --primary:#4759e8;
    --primary-ink:#ffffff;
    --primary-container:#e2e4ff;
    --on-primary-container:#0d1a8f;
    --fault:#b3261e;
    --fault-container:#fbe9e7;
    --ok:#1e7a46;
    --ok-container:#e2f4e8;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#131318;
      --surface:#1d1e25;
      --surface-2:#26272f;
      --outline:#454652;
      --ink:#e6e6ec;
      --ink-dim:#a9aab6;
      --primary:#b8c1ff;
      --primary-ink:#131a6e;
      --primary-container:#2c3070;
      --on-primary-container:#dde1ff;
      --fault:#f2b8b5;
      --fault-container:#5c2b27;
      --ok:#8fd9a8;
      --ok-container:#1f4d31;
    }
  }
  :root[data-theme="dark"]{
    --bg:#131318; --surface:#1d1e25; --surface-2:#26272f; --outline:#454652;
    --ink:#e6e6ec; --ink-dim:#a9aab6;
    --primary:#b8c1ff; --primary-ink:#131a6e; --primary-container:#2c3070; --on-primary-container:#dde1ff;
    --fault:#f2b8b5; --fault-container:#5c2b27;
    --ok:#8fd9a8; --ok-container:#1f4d31;
  }
  :root[data-theme="light"]{
    --bg:#f2f3f9; --surface:#ffffff; --surface-2:#e9eaf3; --outline:#cbccd7;
    --ink:#1a1b21; --ink-dim:#5c5e6a;
    --primary:#4759e8; --primary-ink:#ffffff; --primary-container:#e2e4ff; --on-primary-container:#0d1a8f;
    --fault:#b3261e; --fault-container:#fbe9e7;
    --ok:#1e7a46; --ok-container:#e2f4e8;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Roboto','Noto Sans Hebrew',system-ui,-apple-system,sans-serif;
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:40px 16px 60px;
    -webkit-font-smoothing:antialiased;
  }

  .sheet{
    width:100%;
    max-width:460px;
    background:var(--surface);
    border-radius:28px;
    box-shadow:
      0 1px 2px rgba(0,0,0,.10),
      0 4px 12px rgba(0,0,0,.08),
      0 12px 28px -8px rgba(0,0,0,.12);
    overflow:hidden;
  }

  header{
    padding:26px 28px 20px;
    position:relative;
    background:
      radial-gradient(140% 100% at 50% -30%, var(--primary-container) 0%, transparent 60%);
  }

  .badge-row{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:16px;
  }
  .badge{
    width:40px;
    height:40px;
    flex:0 0 auto;
  }
  .badge-text{
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .org-name{
    font-size:12px;
    font-weight:600;
    color:var(--ink-dim);
    letter-spacing:.01em;
  }

  .tag{
    display:inline-block;
    font-size:12.5px;
    font-weight:600;
    letter-spacing:.01em;
    color:var(--on-primary-container);
    background:var(--primary-container);
    padding:6px 14px;
    border-radius:100px;
    width:fit-content;
  }

  h1{
    margin:0;
    font-size:26px;
    font-weight:700;
    line-height:1.28;
    letter-spacing:-.005em;
  }

  .sub{
    margin:8px 0 0;
    color:var(--ink-dim);
    font-size:14.5px;
    line-height:1.5;
  }

  form{padding:8px 28px 28px;}

  .field{margin-bottom:16px;}

  label{
    display:block;
    font-size:13px;
    font-weight:500;
    margin-bottom:8px;
    color:var(--ink-dim);
  }

  label .req{color:var(--fault); margin-inline-start:2px;}

  input[type="text"], input[type="date"], textarea{
    width:100%;
    background:var(--surface-2);
    border:1.5px solid transparent;
    border-radius:16px;
    color:var(--ink);
    font-family:inherit;
    font-size:16px;
    padding:14px 16px;
    outline:none;
    transition:border-color .15s ease, background .15s ease;
  }

  input::placeholder, textarea::placeholder{color:var(--ink-dim); opacity:.7;}

  input:focus, textarea:focus{
    border-color:var(--primary);
    background:var(--surface);
  }

  textarea{
    resize:vertical;
    min-height:88px;
    line-height:1.5;
  }

  .hint{font-size:12px; color:var(--ink-dim); margin-top:7px; padding-inline-start:2px;}

  button{
    width:100%;
    background:var(--primary);
    color:var(--primary-ink);
    border:none;
    border-radius:100px;
    font-family:inherit;
    font-size:15.5px;
    font-weight:600;
    letter-spacing:.01em;
    padding:16px 16px;
    cursor:pointer;
    margin-top:10px;
    box-shadow:0 1px 3px rgba(0,0,0,.15);
    transition:box-shadow .15s ease, transform .05s ease, filter .15s ease;
  }
  button:active{transform:translateY(1px); box-shadow:0 1px 1px rgba(0,0,0,.1);}
  button:disabled{opacity:.5; cursor:default; box-shadow:none;}
  button:not(:disabled):hover{filter:brightness(1.04); box-shadow:0 2px 6px rgba(0,0,0,.18);}

  .status{
    margin-top:14px;
    font-size:14px;
    padding:13px 16px;
    border-radius:16px;
    display:none;
    line-height:1.5;
    font-weight:500;
  }
  .status.show{display:block;}
  .status.ok{background:var(--ok-container); color:var(--ok);}
  .status.err{background:var(--fault-container); color:var(--fault);}

  .footnote{
    text-align:center;
    color:var(--ink-dim);
    font-size:12px;
    margin-top:16px;
  }

  /* --- status board --- */
  .board{
    padding:20px 28px 22px;
    background:var(--surface-2);
    border-radius:24px;
    margin:0 20px 8px;
  }
  .board-head{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
  }
  .board h2{
    margin:0;
    font-size:18px;
    font-weight:700;
    line-height:1.3;
  }
  .board-title-wrap{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .refresh{
    background:var(--surface);
    border:none;
    color:var(--ink-dim);
    border-radius:100px;
    width:36px;
    height:36px;
    font-size:17px;
    line-height:1;
    cursor:pointer;
    flex:0 0 auto;
    box-shadow:0 1px 2px rgba(0,0,0,.08);
    transition:transform .2s ease, color .12s ease;
  }
  .refresh:hover{color:var(--primary);}
  .refresh.spin{animation:spin .6s linear;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .count-row{
    display:flex;
    align-items:center;
    gap:14px;
    margin:18px 0 18px;
  }
  .count-chip{
    width:64px;
    height:64px;
    border-radius:20px;
    background:var(--primary);
    color:var(--primary-ink);
    display:flex;
    align-items:center;
    justify-content:center;
    flex:0 0 auto;
    box-shadow:0 2px 8px rgba(0,0,0,.12);
  }
  .count-num{
    font-size:28px;
    font-weight:700;
    line-height:1;
    letter-spacing:-.01em;
  }
  .count-label{
    font-size:14px;
    color:var(--ink);
    font-weight:600;
  }
  .count-sub{
    font-size:12px;
    color:var(--ink-dim);
    margin-top:2px;
  }

  .count-breakdown{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin:0 0 18px;
  }
  .unit-chip{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-size:12px;
    font-weight:600;
    color:var(--ink-dim);
    background:var(--surface);
    border-radius:100px;
    padding:5px 12px;
    box-shadow:0 1px 2px rgba(0,0,0,.05);
  }
  .unit-chip b{
    color:var(--ink);
    font-weight:700;
  }

  .board-list{
    display:flex;
    flex-direction:column;
    gap:10px;
    max-height:320px;
    overflow-y:auto;
    padding-inline-end:2px;
  }
  .board-empty-state{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:10px;
    padding:32px 8px 20px;
    color:var(--ink-dim);
    font-size:13.5px;
    text-align:center;
  }
  .board-empty-state svg{opacity:.55;}

  .board-row{
    background:var(--surface);
    border-radius:16px;
    padding:14px 16px;
    box-shadow:0 1px 2px rgba(0,0,0,.06);
    border-inline-start:4px solid var(--outline);
    transition:box-shadow .15s ease;
  }
  .board-row:hover{box-shadow:0 2px 8px rgba(0,0,0,.1);}
  .board-row.age-fresh{border-inline-start-color:var(--ok);}
  .board-row.age-mid{border-inline-start-color:#c9a227;}
  .board-row.age-long{border-inline-start-color:var(--fault);}

  .board-row-top{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
  }
  .board-row-plate{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
  }
  .plate-num{
    font-size:15px;
    font-weight:700;
    letter-spacing:.01em;
  }
  .board-row-unit{
    font-size:11.5px;
    font-weight:600;
    color:var(--on-primary-container);
    background:var(--primary-container);
    border-radius:100px;
    padding:3px 10px;
    flex:0 0 auto;
  }
  .board-row-region{
    color:var(--ink-dim);
    background:var(--surface-2);
  }
  .age-pill{
    font-size:11px;
    font-weight:700;
    border-radius:100px;
    padding:4px 10px;
    flex:0 0 auto;
    white-space:nowrap;
  }
  .age-pill.age-fresh{background:var(--ok-container); color:var(--ok);}
  .age-pill.age-mid{background:color-mix(in srgb, #c9a227 22%, var(--surface-2)); color:#8a6d13;}
  .age-pill.age-long{background:var(--fault-container); color:var(--fault);}

  .board-row-fault{
    font-size:13.5px;
    color:var(--ink);
    margin-top:8px;
    line-height:1.5;
  }
  .board-row-meta{
    font-size:11.5px;
    color:var(--ink-dim);
    margin-top:6px;
    opacity:.9;
  }

  .board-row-actions{
    margin-top:10px;
    padding-top:10px;
    border-top:1px solid var(--surface-2);
  }
  .exit-btn{
    background:transparent;
    border:1.5px solid var(--outline);
    color:var(--ink-dim);
    border-radius:100px;
    font-family:inherit;
    font-size:12.5px;
    font-weight:600;
    padding:7px 14px;
    cursor:pointer;
    transition:color .12s ease, border-color .12s ease;
  }
  .exit-btn:hover{color:var(--primary); border-color:var(--primary);}

  .exit-form{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
  }
  .exit-date-input{
    background:var(--surface-2);
    border:1.5px solid transparent;
    border-radius:100px;
    color:var(--ink);
    font-family:inherit;
    font-size:13px;
    padding:7px 12px;
  }
  .exit-date-input:focus{border-color:var(--primary); outline:none;}
  .exit-confirm, .exit-cancel{
    border-radius:100px;
    font-family:inherit;
    font-size:12.5px;
    font-weight:600;
    padding:7px 14px;
    cursor:pointer;
    border:1.5px solid transparent;
  }
  .exit-confirm{background:var(--primary); color:var(--primary-ink);}
  .exit-confirm:disabled{opacity:.6; cursor:default;}
  .exit-cancel{background:transparent; color:var(--ink-dim); border-color:var(--outline);}
  .exit-err{
    display:block;
    width:100%;
    font-size:11.5px;
    color:var(--fault);
    margin-top:4px;
  }
</style>
</head>
<body>

<div class="sheet">
  <header>
    <div class="badge-row">
      <div class="badge-text">
        <span class="org-name">משטרת ישראל · משמר הגבול</span>
        <span class="tag">כניסת רכב למוסך</span>
      </div>
    </div>
    <h1>דיווח רכבים במוסך</h1>
    <p class="sub">מלאו את הפרטים בעת כניסת הרכב לטיפול. הדיווח נשמר אוטומטית בגיליון המעקב.</p>
  </header>

  <section class="board" id="board" style="margin-top:4px;">
    <div class="board-head">
      <div class="board-title-wrap">
        <span class="tag">תמונת מצב</span>
        <h2>כלי רכב במוסך כרגע</h2>
      </div>
      <button type="button" class="refresh" id="refreshBtn" title="רענון">↻</button>
    </div>

    <div class="count-row">
      <div class="count-chip"><span class="count-num" id="countNum">–</span></div>
      <div>
        <div class="count-label">כלי רכב מדווחים</div>
        <div class="count-sub">כרגע במוסך</div>
      </div>
    </div>

    <div class="count-breakdown" id="countBreakdown"></div>

    <div class="board-list" id="boardList">
      <div class="board-empty-state" id="boardEmpty">טוען נתונים...</div>
    </div>
  </section>

  <form id="faultForm">
    <div class="field">
      <label for="region">מרחב <span class="req">*</span></label>
      <input type="text" id="region" name="region" placeholder="לדוגמה: מרחב ירושלים" required>
    </div>

    <div class="field">
      <label for="unit">יחידה <span class="req">*</span></label>
      <input type="text" id="unit" name="unit" placeholder="לדוגמה: יחידה 3" required>
    </div>

    <div class="field">
      <label for="plate">מספר רכב <span class="req">*</span></label>
      <input type="text" id="plate" name="plate" placeholder="לדוגמה: 123-45-678" inputmode="numeric" required>
    </div>

    <div class="field">
      <label for="fault">מה התקלה <span class="req">*</span></label>
      <textarea id="fault" name="fault" placeholder="תארו את התקלה שדווחה או התגלתה" required></textarea>
    </div>

    <div class="field">
      <label for="entryDate">תאריך כניסה <span class="req">*</span></label>
      <input type="date" id="entryDate" name="entryDate" required>
      <div class="hint">ברירת מחדל: היום. ניתן לשנות במידת הצורך.</div>
    </div>

    <div class="field">
      <label for="reportedBy">דווח ע"י <span class="req">*</span></label>
      <input type="text" id="reportedBy" name="reportedBy" placeholder="שם מלא" required>
    </div>

    <button type="submit" id="submitBtn">שלח דיווח</button>

    <div class="status" id="status"></div>
  </form>
</div>

<script>
  // === הגדרות חיבור ל-Google Sheets ===
  // יש להחליף את הכתובת למטה בכתובת ה-Web App של Apps Script שפרסמתם.
  // ראו הוראות ההתקנה שנשלחו בנפרד.
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw8ReVpfEMuRy-q-mqJNvZRiA3KOE_amiWtAwr6J7QxBDy7S3X0SF63LA8qTVlMZs9PIA/exec";

  const form = document.getElementById('faultForm');
  const statusEl = document.getElementById('status');
  const submitBtn = document.getElementById('submitBtn');
  const entryDateInput = document.getElementById('entryDate');
  const countNum = document.getElementById('countNum');
  const countBreakdown = document.getElementById('countBreakdown');
  const boardList = document.getElementById('boardList');
  const boardEmpty = document.getElementById('boardEmpty');
  const refreshBtn = document.getElementById('refreshBtn');

  // ברירת מחדל: תאריך היום
  entryDateInput.value = new Date().toISOString().slice(0,10);

  // מזהה ייחודי לשליחה הנוכחית — נשמר בין ניסיונות חוזרים של אותו דיווח
  // כדי שרענון/שליחה כפולה לא ייצרו שורה כפולה בגיליון
  let pendingSubmissionId = null;
  function makeId(){
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'id_' + Date.now() + '_' + Math.random().toString(36).slice(2);
  }

  function showStatus(msg, kind){
    statusEl.textContent = msg;
    statusEl.className = 'status show ' + kind;
  }

  function jsonp(url, params){
    return new Promise((resolve, reject) => {
      const cbName = 'cb_' + Math.random().toString(36).slice(2);
      const script = document.createElement('script');
      const timeout = setTimeout(() => {
        cleanup();
        reject(new Error('timeout'));
      }, 20000);

      function cleanup(){
        clearTimeout(timeout);
        delete window[cbName];
        script.remove();
      }

      window[cbName] = (data) => {
        cleanup();
        resolve(data);
      };

      const query = new URLSearchParams({...params, callback: cbName}).toString();
      script.src = url + '?' + query;
      script.onerror = () => { cleanup(); reject(new Error('network')); };
      document.body.appendChild(script);
    });
  }

  function escapeHtml(str){
    return (str || '').toString()
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function daysAgo(dateStr){
    if (!dateStr) return null;
    const then = new Date(dateStr.slice(0, 10) + 'T00:00:00');
    if (isNaN(then.getTime())) return null;
    const now = new Date();
    now.setHours(0,0,0,0);
    const diff = Math.round((now - then) / 86400000);
    return diff;
  }

  function formatDate(dateStr){
    if (!dateStr) return '';
    const datePart = dateStr.slice(0, 10);
    const parts = datePart.split('-');
    if (parts.length !== 3) return dateStr;
    const [y, m, d] = parts;
    return d + '/' + m + '/' + y.slice(-2);
  }

  function renderBoard(items){
    const active = items.filter(item => !item.exitDate);
    countNum.textContent = active.length;

    const counts = {};
    active.forEach(item => {
      const u = (item.unit || '').trim() || 'ללא יחידה';
      counts[u] = (counts[u] || 0) + 1;
    });
    const breakdown = Object.entries(counts).sort((a, b) => b[1] - a[1]);
    countBreakdown.innerHTML = breakdown
      .map(([u, c]) => '<span class="unit-chip">' + escapeHtml(u) + ' <b>' + c + '</b></span>')
      .join('');

    boardList.innerHTML = '';

    if (!active.length){
      boardList.innerHTML =
        '<div class="board-empty-state">' +
          '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17h14M5 17a2 2 0 1 0 4 0 2 2 0 1 0-4 0M15 17a2 2 0 1 0 4 0 2 2 0 1 0-4 0M5 17V9.5a1 1 0 0 1 .3-.7l2.2-2.2A2 2 0 0 1 8.9 6h6.2a2 2 0 0 1 1.4.6l2.2 2.2a1 1 0 0 1 .3.7V17M5 12h14"/></svg>' +
          '<span>אין כרגע כלי רכב מדווחים במוסך</span>' +
        '</div>';
      return;
    }

    const todayStr = new Date().toISOString().slice(0,10);

    active.slice().reverse().forEach(item => {
      const d = daysAgo(item.entryDate);
      let ageClass = 'age-fresh', ageLabel = '';
      if (d === null){
        ageLabel = '';
      } else if (d === 0){
        ageLabel = 'היום';
      } else if (d === 1){
        ageLabel = 'יום 1';
      } else {
        ageLabel = d + ' ימים';
      }
      if (d !== null){
        if (d >= 7) ageClass = 'age-long';
        else if (d >= 3) ageClass = 'age-mid';
      }

      const row = document.createElement('div');
      row.className = 'board-row ' + ageClass;
      row.innerHTML =
        '<div class="board-row-top">' +
          '<div class="board-row-plate">' +
            '<span class="plate-num">' + escapeHtml(item.plate) + '</span>' +
            '<span class="board-row-unit">' + escapeHtml(item.unit) + '</span>' +
            (item.region ? '<span class="board-row-unit board-row-region">' + escapeHtml(item.region) + '</span>' : '') +
          '</div>' +
          (ageLabel ? '<span class="age-pill ' + ageClass + '">' + ageLabel + '</span>' : '') +
        '</div>' +
        '<div class="board-row-fault">' + escapeHtml(item.fault) + '</div>' +
        '<div class="board-row-meta">' +
          'נכנס ' + escapeHtml(formatDate(item.entryDate)) + (item.reportedBy ? ' · דווח ע"י ' + escapeHtml(item.reportedBy) : '') +
        '</div>' +
        '<div class="board-row-actions">' +
          '<button type="button" class="exit-btn" data-row="' + item.row + '">סימון יציאה מהמוסך</button>' +
          '<div class="exit-form" data-row-form="' + item.row + '" hidden>' +
            '<input type="date" class="exit-date-input" value="' + todayStr + '">' +
            '<button type="button" class="exit-confirm" data-row="' + item.row + '">אישור</button>' +
            '<button type="button" class="exit-cancel" data-row="' + item.row + '">ביטול</button>' +
            '<span class="exit-err" hidden></span>' +
          '</div>' +
        '</div>';
      boardList.appendChild(row);
    });
  }

  boardList.addEventListener('click', async (e) => {
    const target = e.target;

    if (target.classList.contains('exit-btn')){
      const form = boardList.querySelector('.exit-form[data-row-form="' + target.dataset.row + '"]');
      if (form){ form.hidden = false; target.hidden = true; }
      return;
    }

    if (target.classList.contains('exit-cancel')){
      const form = target.closest('.exit-form');
      const btn = boardList.querySelector('.exit-btn[data-row="' + target.dataset.row + '"]');
      form.hidden = true;
      if (btn) btn.hidden = false;
      return;
    }

    if (target.classList.contains('exit-confirm')){
      const rowNum = target.dataset.row;
      const form = target.closest('.exit-form');
      const exitDate = form.querySelector('.exit-date-input').value;
      const errEl = form.querySelector('.exit-err');
      errEl.hidden = true;

      if (!exitDate){
        errEl.textContent = 'יש לבחור תאריך.';
        errEl.hidden = false;
        return;
      }

      target.disabled = true;
      target.textContent = 'שומר...';

      try {
        const result = await jsonp(APPS_SCRIPT_URL, { action: 'exit', row: rowNum, exitDate: exitDate });
        if (result && result.ok !== false){
          loadBoard();
        } else {
          target.disabled = false;
          target.textContent = 'אישור';
          errEl.textContent = 'שגיאה בעדכון תאריך היציאה.';
          errEl.hidden = false;
        }
      } catch (err) {
        target.disabled = false;
        target.textContent = 'אישור';
        errEl.textContent = 'שגיאת חיבור. נסו שוב.';
        errEl.hidden = false;
      }
    }
  });

  async function loadBoard(){
    if (APPS_SCRIPT_URL.includes('REPLACE_WITH')){
      boardEmpty.textContent = 'לא הוגדר חיבור לגיליון.';
      countNum.textContent = '–';
      return;
    }
    try {
      const result = await jsonp(APPS_SCRIPT_URL, { action: 'list' });
      if (result && result.ok !== false){
        renderBoard(result.items || []);
      } else {
        boardEmpty.textContent = 'שגיאה בטעינת תמונת המצב.';
      }
    } catch (err) {
      boardEmpty.textContent = 'לא ניתן היה לטעון תמונת מצב כרגע.';
    }
  }

  refreshBtn.addEventListener('click', () => {
    refreshBtn.classList.remove('spin');
    void refreshBtn.offsetWidth;
    refreshBtn.classList.add('spin');
    loadBoard();
  });

  loadBoard();

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    if (APPS_SCRIPT_URL.includes('REPLACE_WITH')){
      showStatus('לא הוגדרה כתובת חיבור ל-Google Sheets. יש להשלים את ההגדרה בקוד.', 'err');
      return;
    }

    if (!pendingSubmissionId){
      pendingSubmissionId = makeId();
    }

    const payload = {
      action: 'submit',
      submissionId: pendingSubmissionId,
      plate: document.getElementById('plate').value.trim(),
      fault: document.getElementById('fault').value.trim(),
      entryDate: entryDateInput.value,
      unit: document.getElementById('unit').value.trim(),
      region: document.getElementById('region').value.trim(),
      reportedBy: document.getElementById('reportedBy').value.trim()
    };

    submitBtn.disabled = true;
    submitBtn.textContent = 'שולח...';
    statusEl.className = 'status';

    try {
      const result = await jsonp(APPS_SCRIPT_URL, payload);
      if (result && result.ok !== false){
        showStatus('הדיווח נשמר בהצלחה.', 'ok');
        pendingSubmissionId = null;
        form.reset();
        entryDateInput.value = new Date().toISOString().slice(0,10);
        loadBoard();
      } else {
        showStatus('שגיאה בשמירת הדיווח: ' + (result && result.error ? result.error : 'לא ידוע'), 'err');
      }
    } catch (err) {
      showStatus('לא ניתן היה להתחבר לגיליון. הדיווח נשמר אוטומטית עם ניסיון חוזר — אפשר ללחוץ "שלח דיווח" שוב בביטחון, לא תיווצר כפילות.', 'err');
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'שלח דיווח';
    }
  });
</script>

</body>
</html>
